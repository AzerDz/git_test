<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        body { animation: fadeIn 0.3s ease forwards; opacity: 0; }
        .calc-btn { transition: transform 0.1s; }
        .calc-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-[#0a0a0f] min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
    <div class="absolute w-[200px] h-[200px] rounded-full bg-gradient-to-br from-[#667eea] to-[#764ba2] blur-3xl opacity-40 pointer-events-none -top-[100px] -left-[50px] animate-[floatOrb_8s_ease-in-out_infinite]"></div>
    <div class="absolute w-[150px] h-[150px] rounded-full bg-gradient-to-br from-[#4facfe] to-[#00f2fe] blur-3xl opacity-40 pointer-events-none -bottom-[80px] -right-[30px] animate-[floatOrb_10s_ease-in-out_infinite_reverse]"></div>

    <a href="index.html" onclick="document.body.style.opacity='0'" class="fixed top-5 left-5 flex items-center gap-2 px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-white hover:bg-white/10 transition-all z-50">
        <i class="fas fa-arrow-left"></i>
        Home
    </a>

    <div class="relative w-full max-w-[420px] p-[30px] rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)]">
        <div class="bg-gradient-to-br from-[#1a1a2e] to-[#16213e] rounded-2xl p-6 mb-6 text-right h-[120px] flex flex-col justify-end border border-white/10">
            <div class="text-white/60 text-base mb-2" id="previousCalculation"></div>
            <div class="text-5xl font-semibold bg-gradient-to-r from-[#667eea] to-[#764ba2] bg-clip-text text-transparent" id="currentResult">0</div>
        </div>

        <div class="grid grid-cols-6 gap-[10px]">
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="sin">sin</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="cos">cos</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="tan">tan</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="log">log</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="ln">ln</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="backspace"><i class="fas fa-backspace"></i></button>

            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="(">(</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value=")">)</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="^">^</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="sqrt">√</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="pi">π</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="e">e</button>

            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="7">7</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="8">8</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="9">9</button>
            <button class="calc-btn bg-gradient-to-br from-[#667eea] to-[#764ba2] text-white rounded-xl py-4 text-base" data-value="/">÷</button>
            <button class="calc-btn bg-gradient-to-br from-[#f093fb] to-[#f5576c] text-white rounded-xl py-4 text-base" data-value="clear">C</button>
            <button class="calc-btn bg-gradient-to-br from-[#f093fb] to-[#f5576c] text-white rounded-xl py-4 text-base" data-value="ac">AC</button>

            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="4">4</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="5">5</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="6">6</button>
            <button class="calc-btn bg-gradient-to-br from-[#667eea] to-[#764ba2] text-white rounded-xl py-4 text-base" data-value="*">×</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="%">%</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="!">!</button>

            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="1">1</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="2">2</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="3">3</button>
            <button class="calc-btn bg-gradient-to-br from-[#667eea] to-[#764ba2] text-white rounded-xl py-4 text-base" data-value="-">-</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="ans">ANS</button>
            <button class="calc-btn bg-gradient-to-br from-[#4facfe] to-[#00f2fe] text-white rounded-xl py-4 text-xl row-span-2" data-value="=">=</button>

            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="0">0</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value=".">.</button>
            <button class="calc-btn bg-gradient-to-br from-[#1a1a2e] to-[#16213e] text-white border border-white/10 rounded-xl py-4 text-base" data-value="negate">±</button>
            <button class="calc-btn bg-gradient-to-br from-[#667eea] to-[#764ba2] text-white rounded-xl py-4 text-base" data-value="+">+</button>
            <button class="calc-btn bg-white/5 border border-white/10 text-white rounded-xl py-4 text-base" data-value="history"><i class="fas fa-history"></i></button>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
