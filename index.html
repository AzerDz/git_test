<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTools - Your Daily Utility Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body { animation: fadeIn 0.3s ease forwards; opacity: 0; }

        .orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px); }
    </style>
</head>
<body class="bg-[#0a0a0f] min-h-screen flex flex-col items-center justify-center p-5 relative overflow-hidden">
    <div class="orb w-[300px] h-[300px] bg-gradient-to-br from-[#667eea] to-[#764ba2] opacity-30 -top-[150px] -left-[100px] animate-[floatOrb_10s_ease-in-out_infinite]"></div>
    <div class="orb w-[250px] h-[250px] bg-gradient-to-br from-[#4facfe] to-[#00f2fe] opacity-30 -bottom-[100px] -right-[80px] animate-[floatOrb_12s_ease-in-out_infinite_reverse]"></div>
    <div class="orb w-[200px] h-[200px] bg-gradient-to-br from-[#f093fb] to-[#f5576c] opacity-20 top-[30%] left-[10%] animate-[floatOrb_15s_ease-in-out_infinite]"></div>

    <div class="relative z-10 text-center max-w-2xl mx-auto w-full">
        <h1 class="text-5xl md:text-6xl font-bold mb-4 bg-gradient-to-r from-[#667eea] via-[#764ba2] to-[#4facfe] bg-clip-text text-transparent">
            QuickTools
        </h1>
        <p class="text-lg text-white/60 mb-12">
            Your daily utility hub. Fast, simple, beautiful.
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <a href="calculator.html" class="flex flex-col justify-between bg-gradient-to-br from-[#1a1a2e] to-[#16213e] rounded-2xl p-8 border border-white/10 backdrop-blur-xl hover:-translate-y-1 hover:shadow-lg transition-all h-full" onclick="document.body.style.opacity='0'">
                <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#667eea] to-[#764ba2] flex items-center justify-center mb-4 mx-auto">
                    <i class="fas fa-calculator text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-semibold text-white mb-2">Scientific Calculator</h2>
                <p class="text-sm text-white/60">Advanced calculator with sin, cos, log, history & more</p>
            </a>

            <a href="quicklinks.html" class="flex flex-col justify-between bg-gradient-to-br from-[#1a1a2e] to-[#16213e] rounded-2xl p-8 border border-white/10 backdrop-blur-xl hover:-translate-y-1 hover:shadow-lg transition-all h-full" onclick="document.body.style.opacity='0'">
                <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#4facfe] to-[#00f2fe] flex items-center justify-center mb-4 mx-auto">
                    <i class="fas fa-link text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-semibold text-white mb-2">Quick Links</h2>
                <p class="text-sm text-white/60">Curated collection of essential links</p>
            </a>

            <div class="flex flex-col justify-between bg-gradient-to-br from-[#1a1a2e] to-[#16213e] rounded-2xl p-8 border border-white/10 backdrop-blur-xl opacity-50 cursor-not-allowed h-full">
                <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#f093fb] to-[#f5576c] flex items-center justify-center mb-4 mx-auto">
                    <i class="fas fa-tools text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-semibold text-white mb-2">More Tools</h2>
                <p class="text-sm text-white/60">Coming soon</p>
            </div>

            <div class="flex flex-col justify-between bg-gradient-to-br from-[#1a1a2e] to-[#16213e] rounded-2xl p-8 border border-white/10 backdrop-blur-xl opacity-50 cursor-not-allowed h-full">
                <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#667eea] to-[#764ba2] flex items-center justify-center mb-4 mx-auto">
                    <i class="fas fa-plus text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-semibold text-white mb-2">Suggest a Tool</h2>
                <p class="text-sm text-white/60">Coming soon</p>
            </div>
        </div>
    </div>
</body>
</html>
